[package]
name = "bmp581"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Driver for the Bosch BMP581 barometer over I2C. Async and blocking, on embedded-hal traits only."
repository = "https://github.com/Lmx154/bmp581-rs"
readme = "README.md"
keywords = ["embedded", "no-std", "driver", "barometer", "bmp581"]
categories = ["embedded", "no-std", "hardware-support"]
rust-version = "1.99"

[features]
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
defmt = { version = "1.0.1", optional = true }

[workspace]
exclude = ["hil"]

[dev-dependencies]
proptest = "1.12"
